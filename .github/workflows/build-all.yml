name: Build todos los SO

# Compila la app para los cinco objetivos (Android, Linux, Windows, macOS,
# iOS) en paralelo y junta todo en UN solo artefacto descargable — al bajarlo
# de la pestaña Actions es un único .zip con una carpeta por SO dentro.
#
# Solo manual (workflow_dispatch), mismo criterio que el resto de build-*.yml.
# No corre analyze/test: eso ya lo cubren los workflows por-SO; este es de
# empaquetado, su producto son los binarios. Cada job sube su build como
# artefacto intermedio (el único modo de pasar ficheros entre jobs) con
# retención corta; el job `empaquetar` los reúne en el artefacto final.
on:
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
      - name: Dependencias de Linux desktop
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/build/linux/x64/release/bundle
          retention-days: 1

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/build/windows/x64/runner/Release
          retention-days: 1

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/build/macos/Build/Products/Release
          retention-days: 1

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: app/build/ios/iphoneos
          retention-days: 1

  # Reúne las cinco builds en un único artefacto. `download-artifact` sin
  # `name` baja TODOS los artefactos de esta ejecución, cada uno en su
  # subcarpeta (dist/android, dist/linux, ...); subir esa carpeta como un
  # solo artefacto hace que descargarlo de Actions dé un único .zip con una
  # carpeta por SO dentro.
  empaquetar:
    runs-on: ubuntu-latest
    needs: [android, linux, windows, macos, ios]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: lcp-builder-todos-los-so
          path: dist
          retention-days: 30
